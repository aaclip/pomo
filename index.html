<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pomodoro</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f8;
      --fg: #1c1c1e;
      --muted: #6b7280;
      --accent: #d64545;
      --btn-bg: #ffffff;
      --btn-border: #d1d5db;
      --btn-fg: #1c1c1e;
      --btn-hover: #f0f0f3;
      --flash: #fde68a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f10;
        --fg: #f5f5f7;
        --muted: #9ca3af;
        --accent: #ff6b6b;
        --btn-bg: #1f1f22;
        --btn-border: #2f2f33;
        --btn-fg: #f5f5f7;
        --btn-hover: #2a2a2e;
        --flash: #4a3a00;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 2rem;
    }
    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #timer {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 200;
      line-height: 1;
      letter-spacing: -0.02em;
      padding: 1rem 2rem;
      border-radius: 1rem;
      transition: background-color 120ms ease, color 120ms ease;
    }
    #timer.flash {
      background: var(--flash);
      color: var(--accent);
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      font: inherit;
      font-size: 1rem;
      padding: 0.6rem 1.4rem;
      min-width: 6rem;
      border-radius: 0.5rem;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;
      transition: background-color 120ms ease, transform 60ms ease;
    }
    button:hover { background: var(--btn-hover); }
    button:active { transform: translateY(1px); }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main>
    <h1>Pomodoro</h1>
    <div id="timer" role="timer" aria-live="polite" aria-atomic="true">25:00</div>
    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button" disabled>Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </main>
  <script>
    (function () {
      const WORK_SECONDS = 25 * 60;
      const timerEl = document.getElementById("timer");
      const startBtn = document.getElementById("start");
      const pauseBtn = document.getElementById("pause");
      const resetBtn = document.getElementById("reset");

      let remaining = WORK_SECONDS;
      let endAt = null;
      let intervalId = null;
      let flashIntervalId = null;
      let audioCtx = null;

      function format(secs) {
        const s = Math.max(0, Math.ceil(secs));
        const mm = String(Math.floor(s / 60)).padStart(2, "0");
        const ss = String(s % 60).padStart(2, "0");
        return mm + ":" + ss;
      }

      function render() {
        timerEl.textContent = format(remaining);
        document.title = format(remaining) + " — Pomodoro";
      }

      function setRunning(running) {
        startBtn.disabled = running;
        pauseBtn.disabled = !running;
      }

      function tick() {
        const now = Date.now();
        remaining = Math.max(0, (endAt - now) / 1000);
        render();
        if (remaining <= 0) finish();
      }

      function start() {
        if (intervalId) return;
        if (remaining <= 0) remaining = WORK_SECONDS;
        stopFlash();
        endAt = Date.now() + remaining * 1000;
        intervalId = setInterval(tick, 200);
        setRunning(true);
        render();
      }

      function pause() {
        if (!intervalId) return;
        remaining = Math.max(0, (endAt - Date.now()) / 1000);
        clearInterval(intervalId);
        intervalId = null;
        endAt = null;
        setRunning(false);
        render();
      }

      function reset() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
        endAt = null;
        remaining = WORK_SECONDS;
        stopFlash();
        setRunning(false);
        render();
      }

      function finish() {
        clearInterval(intervalId);
        intervalId = null;
        endAt = null;
        remaining = 0;
        setRunning(false);
        render();
        beep();
        startFlash();
      }

      function beep() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            audioCtx = new Ctx();
          }
          if (audioCtx.state === "suspended") audioCtx.resume();
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.5);
        } catch (_) { /* ignore audio failures */ }
      }

      function startFlash() {
        let on = true;
        timerEl.classList.add("flash");
        flashIntervalId = setInterval(function () {
          on = !on;
          timerEl.classList.toggle("flash", on);
        }, 500);
        setTimeout(stopFlash, 6000);
      }

      function stopFlash() {
        if (flashIntervalId) {
          clearInterval(flashIntervalId);
          flashIntervalId = null;
        }
        timerEl.classList.remove("flash");
      }

      startBtn.addEventListener("click", start);
      pauseBtn.addEventListener("click", pause);
      resetBtn.addEventListener("click", reset);

      render();
    })();
  </script>
</body>
</html>
